services:
  megaco:
    build: .
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.megaco.rule=Host(`megaco.mausa1.cloud`)"
      - "traefik.http.routers.megaco.entrypoints=web,websecure"
      - "traefik.http.routers.megaco.tls.certresolver=mytlschallenge"
      - "traefik.http.services.megaco.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: root_default
